version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres-dev:
    image: postgres:15-alpine
    container_name: incidents-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_DATABASE_NAME:-incidents_dev}
      POSTGRES_USER: ${DEV_DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DEV_DATABASE_PASSWORD:-postgres}
    ports:
      - "${DEV_DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - incidents-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DATABASE_USERNAME:-postgres} -d ${DEV_DATABASE_NAME:-incidents_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Development
  redis-dev:
    image: redis:7-alpine
    container_name: incidents-redis-dev
    restart: unless-stopped
    ports:
      - "${DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - incidents-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Application in Development Mode
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: incidents-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${DEV_PORT:-3000}
      DATABASE_HOST: ${DEV_DATABASE_HOST:-postgres-dev}
      DATABASE_PORT: ${DEV_DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DEV_DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DEV_DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DEV_DATABASE_NAME:-incidents_dev}
      JWT_SECRET: ${DEV_JWT_SECRET:-dev-jwt-secret-key}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET:-dev-refresh-secret-key}
      ENCRYPTION_KEY: ${DEV_ENCRYPTION_KEY:-dev-encryption-key}
      REDIS_HOST: ${DEV_REDIS_HOST:-redis-dev}
      REDIS_PORT: ${DEV_REDIS_PORT:-6379}
    ports:
      - "${DEV_PORT:-3000}:${DEV_PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - incidents-dev-network
    command: npm run start:dev

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  incidents-dev-network:
    driver: bridge
